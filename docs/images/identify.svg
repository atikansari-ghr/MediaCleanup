<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 684" width="1320" height="684" role="img">
<title>How a title is identified and named</title>
<desc>Films try TMDB then OMDb; shows try TheTVDB and TMDB then TVmaze. A verified single match renames by id. If every source finds nothing the file is named from the file itself. Several matches or an unreachable database never lead to a rename.</desc>
<defs><marker id="ae2e8f0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
