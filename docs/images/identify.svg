<text x="54" y="44" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">How a title is identified and named</text>
<text x="54" y="68" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start">A source is passed over only when it found nothing — never because it found too much, or could not be asked.</text>
