</text><text class="terminal-2617310189-r1" x="0" y="166.4" textLength="280.6" clip-path="url(#terminal-2617310189-line-6)">&#160;&#160;[1.12.1]&#160;-&#160;2026-10-22</text><text class="terminal-2617310189-r1" x="1830" y="166.4" textLength="12.2" clip-path="url(#terminal-2617310189-line-6)">
</text><text class="terminal-2617310189-r1" x="0" y="190.8" textLength="158.6" clip-path="url(#terminal-2617310189-line-7)">&#160;&#160;&#160;&#160;###&#160;Added</text><text class="terminal-2617310189-r1" x="1830" y="190.8" textLength="12.2" clip-path="url(#terminal-2617310189-line-7)">
</text><text class="terminal-2617310189-r1" x="0" y="215.2" textLength="1756.8" clip-path="url(#terminal-2617310189-line-8)">&#160;&#160;&#160;&#160;-&#160;Subtitles&#160;are&#160;chosen&#160;to&#160;fit&#160;the&#160;video.&#160;The&#160;search&#160;results&#160;say&#160;nothing&#160;about&#160;a&#160;subtitle&#x27;s&#160;length,&#160;so&#160;the&#160;choice&#160;is&#160;made&#160;in&#160;two&#160;stages.&#160;*...</text><text class="terminal-2617310189-r1" x="1830" y="215.2" textLength="12.2" clip-path="url(#terminal-2617310189-line-8)">
</text><text class="terminal-2617310189-r1" x="0" y="239.6" textLength="1744.6" clip-path="url(#terminal-2617310189-line-9)">&#160;&#160;&#160;&#160;-&#160;Subtitles&#160;need&#160;an&#160;identified&#160;title.&#160;The&#160;search&#160;no&#160;longer&#160;falls&#160;back&#160;to&#160;a&#160;title&#160;search,&#160;whose&#160;top&#160;hit&#160;can&#160;be&#160;another&#160;film.&#160;An&#160;id&#160;on&#160;the...</text><text class="terminal-2617310189-r1" x="1830" y="239.6" textLength="12.2" clip-path="url(#terminal-2617310189-line-9)">
</text><text class="terminal-2617310189-r1" x="0" y="264" textLength="1744.6" clip-path="url(#terminal-2617310189-line-10)">&#160;&#160;&#160;&#160;-&#160;Subtitle&#160;language&#160;detection&#160;now&#160;uses&#160;real&#160;language&#160;codes:&#160;German&#160;`ger`&#160;is&#160;`de`,&#160;Spanish&#160;`spa`&#160;is&#160;`es`,&#160;Chinese&#160;`chi`&#160;is&#160;`zh`,&#160;Japanese...</text><text class="terminal-2617310189-r1" x="1830" y="264" textLength="12.2" clip-path="url(#terminal-2617310189-line-10)">
</text><text class="terminal-2617310189-r1" x="0" y="288.4" textLength="158.6" clip-path="url(#terminal-2617310189-line-11)">&#160;&#160;&#160;&#160;###&#160;Fixed</text><text class="terminal-2617310189-r1" x="1830" y="288.4" textLength="12.2" clip-path="url(#terminal-2617310189-line-11)">
</text><text class="terminal-2617310189-r1" x="0" y="312.8" textLength="1744.6" clip-path="url(#terminal-2617310189-line-12)">&#160;&#160;&#160;&#160;-&#160;Literal&#160;backspace&#160;characters&#160;had&#160;replaced&#160;regex&#160;word&#160;boundaries&#160;in&#160;three&#160;patterns&#160;(in&#160;v1.10.0,&#160;v1.11.0&#160;and&#160;v1.12.0;&#160;v1.9.0&#160;and&#160;earlier...</text><text class="terminal-2617310189-r1" x="1830" y="312.8" textLength="12.2" clip-path="url(#terminal-2617310189-line-12)">
</text><text class="terminal-2617310189-r1" x="0" y="337.2" textLength="1756.8" clip-path="url(#terminal-2617310189-line-13)">&#160;&#160;&#160;&#160;-&#160;`--subtitles`&#160;required&#160;a&#160;username&#160;and&#160;password&#160;that&#160;the&#160;service&#160;does&#160;not&#160;require,&#160;and&#160;hid&#160;why&#160;a&#160;login&#160;failed.&#160;OpenSubtitles&#x27;&#160;manual&#160;say...</text><text class="terminal-2617310189-r1" x="1830" y="337.2" textLength="12.2" clip-path="url(#terminal-2617310189-line-13)">
</text><text class="terminal-2617310189-r1" x="0" y="361.6" textLength="1744.6" clip-path="url(#terminal-2617310189-line-14)">&#160;&#160;&#160;&#160;-&#160;TV&#160;episodes&#160;were&#160;searched&#160;for&#160;the&#160;wrong&#160;thing.&#160;The&#160;tool&#160;passed&#160;the&#160;series&#160;id&#160;as&#160;`imdb_id`&#160;with&#160;no&#160;season&#160;or&#160;episode,&#160;which&#160;returns&#160;the...</text><text class="terminal-2617310189-r1" x="1830" y="361.6" textLength="12.2" clip-path="url(#terminal-2617310189-line-14)">
</text><text class="terminal-2617310189-r1" x="0" y="386" textLength="1756.8" clip-path="url(#terminal-2617310189-line-15)">&#160;&#160;&#160;&#160;-&#160;Every&#160;film&#160;search&#160;was&#160;redirected.&#160;The&#160;tool&#160;sent&#160;`imdb_id`&#160;with&#160;leading&#160;zeros&#160;and&#160;parameters&#160;out&#160;of&#160;order;&#160;the&#160;service&#160;redirects&#160;such&#160;re...</text><text class="terminal-2617310189-r1" x="1830" y="386" textLength="12.2" clip-path="url(#terminal-2617310189-line-15)">
</text><text class="terminal-2617310189-r1" x="0" y="410.4" textLength="1756.8" clip-path="url(#terminal-2617310189-line-16)">&#160;&#160;&#160;&#160;-&#160;Up&#160;to&#160;three&#160;searches&#160;are&#160;tried&#160;per&#160;file,&#160;most&#160;precise&#160;first&#160;(id&#160;+&#160;hash,&#160;then&#160;id,&#160;then&#160;hash),&#160;so&#160;a&#160;wrong&#160;id&#160;no&#160;longer&#160;hides&#160;an&#160;exact-rel...</text><text class="terminal-2617310189-r1" x="1830" y="410.4" textLength="12.2" clip-path="url(#terminal-2617310189-line-16)">
</text><text class="terminal-2617310189-r1" x="0" y="434.8" textLength="1756.8" clip-path="url(#terminal-2617310189-line-17)">&#160;&#160;&#160;&#160;-&#160;Requests&#160;are&#160;spaced&#160;under&#160;the&#160;documented&#160;rate&#160;limit,&#160;a&#160;rate-limit&#160;answer&#160;is&#160;waited&#160;out,&#160;the&#160;login&#x27;s&#160;`base_url`&#160;is&#160;used&#160;for&#160;later&#160;reques...</text><text class="terminal-2617310189-r1" x="1830" y="434.8" textLength="12.2" clip-path="url(#terminal-2617310189-line-17)">
</text><text class="terminal-2617310189-r1" x="0" y="459.2" textLength="1720.2" clip-path="url(#terminal-2617310189-line-18)">&#160;&#160;&#160;&#160;-&#160;When&#160;downloads&#160;stop,&#160;the&#160;message&#160;says&#160;why&#160;-&#160;the&#160;quota&#160;with&#160;its&#160;renewal&#160;time,&#160;or&#160;a&#160;refused&#160;key&#160;-&#160;instead&#160;of&#160;a&#160;generic&#160;&quot;quota_exhausted&quot;.</text><text class="terminal-2617310189-r1" x="1830" y="459.2" textLength="12.2" clip-path="url(#terminal-2617310189-line-18)">
</text><text class="terminal-2617310189-r1" x="0" y="483.6" textLength="451.4" clip-path="url(#terminal-2617310189-line-19)">&#160;&#160;&#160;&#160;...&#160;and&#160;1&#160;more&#160;-&#160;see&#160;CHANGELOG.md</text><text class="terminal-2617310189-r1" x="1830" y="483.6" textLength="12.2" clip-path="url(#terminal-2617310189-line-19)">
</text>
