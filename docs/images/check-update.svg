    <text class="terminal-2617310189-r1" x="0" y="20" textLength="988.2" clip-path="url(#terminal-2617310189-line-0)">MediaCleanup&#160;1.12.0&#160;-&#160;checking&#160;atikansari-ghr/MediaCleanup&#160;for&#160;a&#160;newer&#160;release...</text><text class="terminal-2617310189-r1" x="1830" y="20" textLength="12.2" clip-path="url(#terminal-2617310189-line-0)">
