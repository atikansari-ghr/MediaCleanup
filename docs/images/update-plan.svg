</text><text class="terminal-3094273548-r1" x="0" y="44.4" textLength="451.4" clip-path="url(#terminal-3094273548-line-1)">Release&#160;v1.12.1,&#160;published&#160;2026-10-22</text><text class="terminal-3094273548-r1" x="1586" y="44.4" textLength="12.2" clip-path="url(#terminal-3094273548-line-1)">
</text><text class="terminal-3094273548-r1" x="1586" y="68.8" textLength="12.2" clip-path="url(#terminal-3094273548-line-2)">
</text><text class="terminal-3094273548-r1" x="0" y="93.2" textLength="280.6" clip-path="url(#terminal-3094273548-line-3)">&#160;&#160;[1.12.1]&#160;-&#160;2026-10-22</text><text class="terminal-3094273548-r1" x="1586" y="93.2" textLength="12.2" clip-path="url(#terminal-3094273548-line-3)">
</text><text class="terminal-3094273548-r1" x="0" y="117.6" textLength="158.6" clip-path="url(#terminal-3094273548-line-4)">&#160;&#160;&#160;&#160;###&#160;Added</text><text class="terminal-3094273548-r1" x="1586" y="117.6" textLength="12.2" clip-path="url(#terminal-3094273548-line-4)">
</text><text class="terminal-3094273548-r1" x="0" y="142" textLength="1561.6" clip-path="url(#terminal-3094273548-line-5)">&#160;&#160;&#160;&#160;-&#160;Subtitles&#160;are&#160;chosen&#160;to&#160;fit&#160;the&#160;video.&#160;The&#160;search&#160;results&#160;say&#160;nothing&#160;about&#160;a&#160;subtitle&#x27;s&#160;length,&#160;so&#160;the&#160;choice&#160;is&#160;made&#160;in&#160;</text><text class="terminal-3094273548-r1" x="1586" y="142" textLength="12.2" clip-path="url(#terminal-3094273548-line-5)">
</text><text class="terminal-3094273548-r1" x="0" y="166.4" textLength="195.2" clip-path="url(#terminal-3094273548-line-6)">two&#160;stages.&#160;*...</text><text class="terminal-3094273548-r1" x="1586" y="166.4" textLength="12.2" clip-path="url(#terminal-3094273548-line-6)">
</text><text class="terminal-3094273548-r1" x="0" y="190.8" textLength="1586" clip-path="url(#terminal-3094273548-line-7)">&#160;&#160;&#160;&#160;-&#160;Subtitles&#160;need&#160;an&#160;identified&#160;title.&#160;The&#160;search&#160;no&#160;longer&#160;falls&#160;back&#160;to&#160;a&#160;title&#160;search,&#160;whose&#160;top&#160;hit&#160;can&#160;be&#160;another&#160;film.&#160;An</text><text class="terminal-3094273548-r1" x="1586" y="190.8" textLength="12.2" clip-path="url(#terminal-3094273548-line-7)">
</text><text class="terminal-3094273548-r1" x="0" y="215.2" textLength="146.4" clip-path="url(#terminal-3094273548-line-8)">id&#160;on&#160;the...</text><text class="terminal-3094273548-r1" x="1586" y="215.2" textLength="12.2" clip-path="url(#terminal-3094273548-line-8)">
</text><text class="terminal-3094273548-r1" x="0" y="239.6" textLength="1537.2" clip-path="url(#terminal-3094273548-line-9)">&#160;&#160;&#160;&#160;-&#160;Subtitle&#160;language&#160;detection&#160;now&#160;uses&#160;real&#160;language&#160;codes:&#160;German&#160;`ger`&#160;is&#160;`de`,&#160;Spanish&#160;`spa`&#160;is&#160;`es`,&#160;Chinese&#160;`chi`&#160;is&#160;</text><text class="terminal-3094273548-r1" x="1586" y="239.6" textLength="12.2" clip-path="url(#terminal-3094273548-line-9)">
</text><text class="terminal-3094273548-r1" x="0" y="264" textLength="207.4" clip-path="url(#terminal-3094273548-line-10)">`zh`,&#160;Japanese...</text><text class="terminal-3094273548-r1" x="1586" y="264" textLength="12.2" clip-path="url(#terminal-3094273548-line-10)">
</text><text class="terminal-3094273548-r1" x="0" y="288.4" textLength="158.6" clip-path="url(#terminal-3094273548-line-11)">&#160;&#160;&#160;&#160;###&#160;Fixed</text><text class="terminal-3094273548-r1" x="1586" y="288.4" textLength="12.2" clip-path="url(#terminal-3094273548-line-11)">
</text><text class="terminal-3094273548-r1" x="0" y="312.8" textLength="1573.8" clip-path="url(#terminal-3094273548-line-12)">&#160;&#160;&#160;&#160;-&#160;Literal&#160;backspace&#160;characters&#160;had&#160;replaced&#160;regex&#160;word&#160;boundaries&#160;in&#160;three&#160;patterns&#160;(in&#160;v1.10.0,&#160;v1.11.0&#160;and&#160;v1.12.0;&#160;v1.9.0&#160;</text><text class="terminal-3094273548-r1" x="1586" y="312.8" textLength="12.2" clip-path="url(#terminal-3094273548-line-12)">
</text><text class="terminal-3094273548-r1" x="0" y="337.2" textLength="170.8" clip-path="url(#terminal-3094273548-line-13)">and&#160;earlier...</text><text class="terminal-3094273548-r1" x="1586" y="337.2" textLength="12.2" clip-path="url(#terminal-3094273548-line-13)">
</text><text class="terminal-3094273548-r1" x="0" y="361.6" textLength="1586" clip-path="url(#terminal-3094273548-line-14)">&#160;&#160;&#160;&#160;-&#160;`--subtitles`&#160;required&#160;a&#160;username&#160;and&#160;password&#160;that&#160;the&#160;service&#160;does&#160;not&#160;require,&#160;and&#160;hid&#160;why&#160;a&#160;login&#160;failed.&#160;OpenSubtitles&#x27;</text><text class="terminal-3094273548-r1" x="1586" y="361.6" textLength="12.2" clip-path="url(#terminal-3094273548-line-14)">
</text><text class="terminal-3094273548-r1" x="0" y="386" textLength="158.6" clip-path="url(#terminal-3094273548-line-15)">manual&#160;say...</text><text class="terminal-3094273548-r1" x="1586" y="386" textLength="12.2" clip-path="url(#terminal-3094273548-line-15)">
</text><text class="terminal-3094273548-r1" x="0" y="410.4" textLength="1573.8" clip-path="url(#terminal-3094273548-line-16)">&#160;&#160;&#160;&#160;-&#160;TV&#160;episodes&#160;were&#160;searched&#160;for&#160;the&#160;wrong&#160;thing.&#160;The&#160;tool&#160;passed&#160;the&#160;series&#160;id&#160;as&#160;`imdb_id`&#160;with&#160;no&#160;season&#160;or&#160;episode,&#160;which&#160;</text><text class="terminal-3094273548-r1" x="1586" y="410.4" textLength="12.2" clip-path="url(#terminal-3094273548-line-16)">
</text><text class="terminal-3094273548-r1" x="0" y="434.8" textLength="170.8" clip-path="url(#terminal-3094273548-line-17)">returns&#160;the...</text><text class="terminal-3094273548-r1" x="1586" y="434.8" textLength="12.2" clip-path="url(#terminal-3094273548-line-17)">
</text><text class="terminal-3094273548-r1" x="0" y="459.2" textLength="451.4" clip-path="url(#terminal-3094273548-line-18)">&#160;&#160;&#160;&#160;...&#160;and&#160;5&#160;more&#160;-&#160;see&#160;CHANGELOG.md</text><text class="terminal-3094273548-r1" x="1586" y="459.2" textLength="12.2" clip-path="url(#terminal-3094273548-line-18)">
