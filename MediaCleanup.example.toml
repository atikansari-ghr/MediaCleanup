# MediaCleanup configuration — TEMPLATE
#
# Setup:
#   1. Copy this file to MediaCleanup.toml (same folder as MediaCleanup_Enhanced.py).
#   2. Edit the paths below to match your system.
#   3. (Optional) Add API keys under [coverart] to enable online poster fetching.
#
# MediaCleanup.toml is git-ignored on purpose — it holds your private API keys.
# Paths use TOML literal strings (single quotes) so backslashes need no escaping.

[tools]
# Folder containing the MKVToolNix binaries (mkvmerge.exe, mkvpropedit.exe, ...)
# Download: https://mkvtoolnix.download/
mkvtoolnix_dir = 'C:\Program Files\MKVToolNix'

# Optional per-tool overrides. When omitted, each tool is resolved
# inside mkvtoolnix_dir using its standard name:
# mkvmerge    = 'C:\Program Files\MKVToolNix\mkvmerge.exe'
# mkvpropedit = 'C:\Program Files\MKVToolNix\mkvpropedit.exe'
# mkvinfo     = 'C:\Program Files\MKVToolNix\mkvinfo.exe'
# mkvextract  = 'C:\Program Files\MKVToolNix\mkvextract.exe'

[filebot]
# Optional. If 'exe' is omitted or the file does not exist, the script runs
# without FileBot (renaming falls back to built-in filename heuristics).
# Installed:              exe = 'C:\Program Files\FileBot\filebot.exe'
# Portable (recommended): exe = 'D:\Projects\MediaCleanup\runtimes\FileBot\filebot.exe'
db = "TheMovieDB"

[paths]
movies_root = 'D:\Media\Movies'   # source movies (scanned recursively)
tv_root     = 'D:\Media\TV'       # source TV episodes
work_root   = 'D:\Media\ToFix'    # working copies (auto-deleted on success)
output_root = 'D:\Media\Fixed'    # remuxed output (mirrors source structure)

[coverart]
# API keys for the --coverart mode. All optional — an empty value disables that
# source. Local poster files (poster.jpg/cover.jpg/folder.jpg) always work.
# Source priority: local file -> TMDB -> fanart.tv -> OMDb.
#   TMDB:      https://www.themoviedb.org/settings/api        (free signup)
#   fanart.tv: https://fanart.tv/get-an-api-key/              (free project key)
#   OMDb:      https://www.omdbapi.com/apikey.aspx            (free, 1000 req/day)
tmdb_api_key     = ""
fanarttv_api_key = ""
omdb_api_key     = ""

[subtitles]
# OpenSubtitles.com credentials for the --subtitles mode (sidecar .srt download).
# All three are required for downloads: https://www.opensubtitles.com/en/consumers
# Free accounts: ~20 downloads/day; VIP: 1000/day.
api_key  = ""
username = ""
password = ""
# Languages to download (ISO 639-1). A single language saves as '<movie>.srt';
# extra languages get a suffix like '<movie>.hin.srt'.
languages = ["en"]
